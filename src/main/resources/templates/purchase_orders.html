<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Purchase Orders</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 px-0">
                <div th:insert="fragments/sidebar :: sidebar"></div>
            </div>

            <!-- Main Content -->
            <div class="col-md-9 col-lg-10 ms-auto">
                <div class="main-content">
                    <h1 class="page-title">
                        <i class="fas fa-shopping-cart me-2"></i>Purchase Orders
                    </h1>

                    <!-- Display error message if present -->
                    <div th:if="${error}" class="alert alert-danger">
                        <i class="fas fa-exclamation-circle me-2"></i>
                        <span th:text="${error}"></span>
                    </div>

                    <!-- Display success message if present -->
                    <div th:if="${success}" class="alert alert-success">
                        <i class="fas fa-check-circle me-2"></i>
                        <span th:text="${success}"></span>
                    </div>

                    <!-- Form to create new purchase order -->
                    <div class="card">
                        <div class="card-header">
                            <h5 class="card-title mb-0">
                                <i class="fas fa-plus-circle me-2"></i>New Purchase Order
                            </h5>
                        </div>
                        <div class="card-body">
                            <form th:action="@{/purchase-orders/create}" method="post">
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="supplier" class="form-label">
                                            <i class="fas fa-building me-2"></i>Supplier
                                        </label>
                                        <select id="supplier" name="supplierId" class="form-select" required>
                                            <option value="">Select a supplier</option>
                                            <option th:each="supplier : ${suppliers}"
                                                    th:value="${supplier.id}"
                                                    th:text="${supplier.name}">
                                            </option>
                                        </select>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="quotation" class="form-label">
                                            <i class="fas fa-file-invoice-dollar me-2"></i>Quotation
                                        </label>
                                        <select id="quotation" name="quotationId" class="form-select">
                                            <option value="">Select a quotation (optional)</option>
                                            <option th:each="quotation : ${quotations}"
                                                    th:value="${quotation.id}"
                                                    th:text="${quotation.id + ' - ' + quotation.supplier.name}">
                                            </option>
                                        </select>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="orderDate" class="form-label">
                                            <i class="fas fa-calendar me-2"></i>Order Date
                                        </label>
                                        <input type="date" id="orderDate" name="orderDate" class="form-control" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="expectedDeliveryDate" class="form-label">
                                            <i class="fas fa-truck me-2"></i>Expected Delivery Date
                                        </label>
                                        <input type="date" id="expectedDeliveryDate" name="expectedDeliveryDate" class="form-control" required>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="currency" class="form-label">
                                            <i class="fas fa-money-bill me-2"></i>Currency
                                        </label>
                                        <select id="currency" name="currency" class="form-select" required>
                                            <option value="EUR">EUR</option>
                                            <option value="USD">USD</option>
                                            <option value="GBP">GBP</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="paymentTerms" class="form-label">
                                            <i class="fas fa-file-contract me-2"></i>Payment Terms
                                        </label>
                                        <select id="paymentTerms" name="paymentTerms" class="form-select" required>
                                            <option value="IMMEDIATE">Immediate</option>
                                            <option value="NET30">Net 30</option>
                                            <option value="NET60">Net 60</option>
                                            <option value="NET90">Net 90</option>
                                        </select>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save me-2"></i>Create Purchase Order
                                </button>
                            </form>
                        </div>
                    </div>

                    <!-- List of purchase orders -->
                    <div class="card">
                        <div class="card-header">
                            <h5 class="card-title mb-0">
                                <i class="fas fa-list me-2"></i>Purchase Order List
                            </h5>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-hover">
                                    <thead>
                                        <tr>
                                            <th><i class="fas fa-hashtag me-2"></i>Order Number</th>
                                            <th><i class="fas fa-building me-2"></i>Supplier</th>
                                            <th><i class="fas fa-calendar me-2"></i>Order Date</th>
                                            <th><i class="fas fa-truck me-2"></i>Expected Delivery</th>
                                            <th><i class="fas fa-money-bill me-2"></i>Total Amount</th>
                                            <th><i class="fas fa-money-bill me-2"></i>Currency</th>
                                            <th><i class="fas fa-tasks me-2"></i>Status</th>
                                            <th><i class="fas fa-cogs me-2"></i>Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="order : ${orders}">
                                            <td th:text="${order.orderNumber}"></td>
                                            <td th:text="${order.supplier.name}"></td>
                                            <td th:text="${#temporals.format(order.orderDate, 'dd/MM/yyyy')}"></td>
                                            <td th:text="${#temporals.format(order.expectedDeliveryDate, 'dd/MM/yyyy')}"></td>
                                            <td th:text="${order.totalAmount}"></td>
                                            <td th:text="${order.currency}"></td>
                                            <td>
                                                <span class="badge" th:classappend="${order.status == 'DRAFT' ? 'bg-warning' : 
                                                                                    (order.status == 'CONFIRMED' ? 'bg-info' : 
                                                                                    (order.status == 'DELIVERED' ? 'bg-success' : 
                                                                                    (order.status == 'CANCELLED' ? 'bg-danger' : 'bg-secondary')))}"
                                                      th:text="${order.status}">
                                                </span>
                                            </td>
                                            <td>
                                                <div class="btn-group">
                                                    <a th:href="@{/purchase-orders/{id}(id=${order.id})}" 
                                                       class="btn btn-sm btn-info">
                                                        <i class="fas fa-eye"></i>
                                                    </a>
                                                    <a th:href="@{/purchase-orders/{id}/edit(id=${order.id})}" 
                                                       class="btn btn-sm btn-warning">
                                                        <i class="fas fa-edit"></i>
                                                    </a>
                                                    <button type="button" 
                                                            class="btn btn-sm btn-danger"
                                                            th:onclick="'deleteOrder(' + ${order.id} + ')'">
                                                        <i class="fas fa-trash"></i>
                                                    </button>
                                                </div>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div th:insert="fragments/footer :: footer"></div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function deleteOrder(id) {
            if (confirm('Are you sure you want to delete this purchase order?')) {
                window.location.href = '/purchase-orders/' + id + '/delete';
            }
        }
    </script>
</body>
</html>
