<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Liste des Salaires</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
    <style>
        .employee-card {
            background: #f8f9fa;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            padding: 2rem 2.5rem;
            margin-bottom: 2rem;
        }
        .employee-label {
            font-weight: 500;
            color: #555;
        }
        .employee-value {
            font-weight: 600;
            color: #222;
        }
        .salary-table th, .salary-table td {
            vertical-align: middle;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <!-- Inclure la navbar -->
    <div th:replace="~{fragments/navbar :: navbar('rh')}"></div>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="mb-1"><i class="bi bi-cash-stack"></i> Graphique des Salaires</h2>
            </div>
        </div>

        <div>
            <form th:action="@{/salary/graph}" class="row g-2 align-items-end mb-3" method="GET">
                <div class="col-auto">
                    <label for="annee" class="form-label mb-0">Année</label>
                    <input type="number" id="annee" name="annee" class="form-control" min="1900" max="2100" placeholder="Année" th:value="${annee}">
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-primary">Filtrer</button>
                </div>
            </form>
        </div>
        
        <div class="card mb-5">
            <div class="card-body">
                <h5 class="card-title">Répartition des salaires par mois</h5>
                <div style="height: 400px;">
                    <canvas id="salaryChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        const labels = ["Janvier", "Février", "Mars", "Avril", "Mai", "Juin", "Juillet", "Août", "Septembre", "Octobre", "Novembre", "Décembre"];
        const net_pay = [[${net_pay}]];
        const grossPays = [[${grossPays}]];
        const total_deductions = [[${total_deductions}]];
        const total_earnings = [[${total_earnings}]];
        const deductions = [[${deductions}]];

        document.addEventListener('DOMContentLoaded', function() {
            const ctx = document.getElementById('salaryChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Net à payer',
                            data: net_pay,
                            backgroundColor: 'rgba(54, 162, 235, 0.2)',
                            borderColor: 'rgba(54, 162, 235, 1)',
                            borderWidth: 2,
                            tension: 0.1,
                            fill: false,
                            pointRadius: 4
                        },
                        {
                            label: 'Total Brut',
                            data: grossPays,
                            backgroundColor: 'rgba(40, 167, 69, 0.2)',
                            borderColor: 'rgba(40, 167, 69, 1)',
                            borderWidth: 2,
                            tension: 0.1,
                            fill: false,
                            pointRadius: 4
                        },
                        {
                            label: 'Total Deductions',
                            data: total_deductions,
                            backgroundColor: 'rgba(220, 53, 69, 0.2)',
                            borderColor: 'rgba(220, 53, 69, 1)',
                            borderWidth: 2,
                            tension: 0.1,
                            fill: false,
                            pointRadius: 4
                        },
                        {
                            label: 'Total Earnings',
                            data: total_earnings,
                            backgroundColor: 'rgba(255, 193, 7, 0.2)',
                            borderColor: 'rgba(255, 193, 7, 1)',
                            borderWidth: 2,
                            tension: 0.1,
                            fill: false,
                            pointRadius: 4
                        },
                        {
                            label: 'Total Deductions (détail)',
                            data: deductions,
                            backgroundColor: 'rgba(108, 117, 125, 0.2)',
                            borderColor: 'rgba(108, 117, 125, 1)',
                            borderWidth: 2,
                            tension: 0.1,
                            fill: false,
                            pointRadius: 4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: false
                        }
                    }
                }
            });
        });
        /*]]>*/
    </script>
</body>
</html>
