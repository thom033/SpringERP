<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Liste des Salaires</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
    <style>
        .employee-card {
            background: #f8f9fa;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            padding: 2rem 2.5rem;
            margin-bottom: 2rem;
        }
        .employee-label {
            font-weight: 500;
            color: #555;
        }
        .employee-value {
            font-weight: 600;
            color: #222;
        }
        .salary-table th, .salary-table td {
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <!-- Inclure la navbar -->
    <div th:replace="~{fragments/navbar :: navbar('rh')}"></div>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="mb-1"><i class="bi bi-cash-stack"></i>Generate Salary Slip</h2>
            </div>
        </div>

        <div>
            <form th:action="@{/salary/generate}" class="row g-2 align-items-end mb-3" method="POST">
                <div class="col-auto">
                    <div class="col-auto">
                        <label for="mois" class="form-label mb-0">Employee</label>
                        <select name="name" class="form-control">
                            <option value="">-- xxx --</option>
                            <th:block th:each="employee : ${employees}">
                            <option th:value="${employee.name}" th:text="${employee.first_name}"></option>
                            </th:block>
                        </select>
                    </div>
                    <label for="annee" class="form-label mb-0">Debut</label>
                    <input type="date" id="debut" name="debut" class="form-control"  placeholder="debut">
                    <label for="annee" class="form-label mb-0">Fin</label>
                    <input type="date" id="fin" name="fin" class="form-control"  placeholder="fin">
                    <label for="annee" class="form-label mb-0">Salaire base</label>
                    <input type="number" id="base" name="base" class="form-control"  placeholder="base">
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-primary">Filtrer</button>
                </div>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>
</html>
