<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Liste des Salaires</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
    <style>
        .employee-card {
            background: #f8f9fa;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            padding: 2rem 2.5rem;
            margin-bottom: 2rem;
        }
        .employee-label {
            font-weight: 500;
            color: #555;
        }
        .employee-value {
            font-weight: 600;
            color: #222;
        }
        .salary-table {
            table-layout: auto !important; /* Force la largeur auto pour chaque colonne */
            width: 100%;
        }
        .salary-table th, .salary-table td {
            vertical-align: middle;
            padding: 0.75rem 1.5rem;
            white-space: nowrap; /* Optionnel : évite le retour à la ligne si vous voulez */
        }
        .salary-table tr {
            line-height: 2.2;
        }
        .table-responsive {
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <!-- Inclure la navbar -->
    <div th:replace="~{fragments/navbar :: navbar('rh')}"></div>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="mb-1"><i class="bi bi-cash-stack"></i>Update Base</h2>
            </div>
        </div>

        <div>
            <form th:action="@{/salary/update-base}" class="row g-2 align-items-end mb-3" method="POST">
                <div class="row align-items-center">
                    <label for="condition" class="form-label mb-0">Amount</label>
                    <div class="d-flex">  

                        <select name="component" class="form-control w-25 me-1">
                            <option value="">-- xxx --</option>
                            <th:block th:each="component : ${components}">
                            <option th:value="${component.salary_component}" th:text="${component.salary_component}"></option>
                            </th:block>
                        </select>
                        <select name="condition" class="form-control w-25 me-1">
                            <option value=">=">>=</option>
                            <option value="<="><=</option>
                            
                        </select>
                        <input type="number" id="amount" name="amount" class="form-control"  placeholder="amount" required>
                    </div>

                    <div>
                        <button type="submit" class="btn btn-primary mt-4">Get Employee</button>
                    </div>
                    
                </div>

            </form>
        </div>

        <div>
            <p>Condition : <span th:text="${component}"></span> <span th:text="${condition}"></span> <span th:text="${amount}"></span></p>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="mb-3">
                    <form th:action="@{/salary/update-base/all}" method="POST">
                        <input type="hidden" name="component" th:value="${component}">
                        <input type="hidden" name="condition" th:value="${condition}">
                        <input type="hidden" name="amount" th:value="${amount}">

                        <label for="annee" class="form-label mb-0">Update</label>
                        <div class="d-flex">
                            <input type="number" id="value" name="value" class="form-control"  placeholder="value" required>
                            <label class="form-label mb-0 ms-2 mt-2">%</label>
                        </div>

                        <div>
                            <button type="submit" class="btn btn-primary mt-4">Update all</button>
                        </div>
                    </form>
                </div>
                <div class="table-responsive">
                    <table class="table salary-table align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Date</th>
                                <th>Employee Name</th>
                                <th>Structure</th>
                                <th>Total Brut</th>
                                <th>Total Déductions</th>
                                <th>Net à payer</th>
                                <th th:each="component : ${components}" th:text="${component.salary_component}"></th>
                                <th>...........Action...........</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="salary : ${salarys}">
                                <td th:text="${#temporals.format(salary.posting_date, 'dd/MM/yyyy')}"></td>
                                <td th:text="${salary.employee_name}"></td>
                                <td th:text="${salary.salary_structure}"></td>
                                <td th:text="${#numbers.formatDecimal(salary.total_earnings, 1, 'COMMA', 2, 'POINT')} + ' ' + ${salary.currency}"></td>
                                <td th:text="${#numbers.formatDecimal(salary.total_deduction, 1, 'COMMA', 2, 'POINT')} + ' ' + ${salary.currency}"></td>
                                <td>
                                    <span class="fw-bold text-success" th:text="${#numbers.formatDecimal(salary.net_pay, 1, 'COMMA', 2, 'POINT')} + ' ' + ${salary.currency}"></span>
                                </td>
                                
                                <td th:each="component : ${components}">
                                    <span th:if="${component.type == 'Earning'}">
                                        <span th:with="found=false">
                                            <span th:each="earning : ${salary.earnings}">
                                                <span th:if="${!found and earning.salary_component == component.salary_component}" th:text="${earning.amount}" th:with="found=true"></span>
                                            </span>
                                        </span>
                                    </span>
                                    <span th:if="${component.type == 'Deduction'}">
                                        <span th:with="found=false">
                                            <span th:each="deduction : ${salary.deductions}">
                                                <span th:if="${!found and deduction.salary_component == component.salary_component}" th:text="${deduction.amount}" th:with="found=true"></span>
                                            </span>
                                        </span>
                                    </span>
                                </td>
                                <td>
                                    <form th:action="@{/salary/update-base/unit}" method="POST">
                                        <div class="d-flex">
                                            <input type="hidden" name="component" th:value="${component}">
                                            <input type="hidden" name="condition" th:value="${condition}">
                                            <input type="hidden" name="amount" th:value="${amount}">
                                            <input type="hidden" name="slip" th:value="${salary.name}">
                                            <input type="number" name="value" id="value" class="form-control me-1">
                                            <label class="ms-1 me-1">%</label>
                                            <input type="submit" value="ok" class="btn btn-primary">
                                        </div>
                                        
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(salarys)}">
                                <td colspan="10" class="text-center text-muted">Aucun salaire trouvé pour cet employé.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>
</html>
