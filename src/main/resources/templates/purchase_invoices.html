<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Purchase Invoices</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 px-0">
                <div th:insert="fragments/sidebar :: sidebar"></div>
            </div>

            <!-- Main Content -->
            <div class="col-md-9 col-lg-10 ms-auto">
                <div class="main-content">
                    <h1 class="page-title">
                        <i class="fas fa-file-invoice me-2"></i>Purchase Invoices
                    </h1>

                    <!-- Display error message if present -->
                    <div th:if="${error}" class="alert alert-danger">
                        <i class="fas fa-exclamation-circle me-2"></i>
                        <span th:text="${error}"></span>
                    </div>

                    <!-- Display success message if present -->
                    <div th:if="${success}" class="alert alert-success">
                        <i class="fas fa-check-circle me-2"></i>
                        <span th:text="${success}"></span>
                    </div>

                    <!-- Form to create new invoice -->
                    <div class="card">
                        <div class="card-header">
                            <h5 class="card-title mb-0">
                                <i class="fas fa-plus-circle me-2"></i>New Invoice
                            </h5>
                        </div>
                        <div class="card-body">
                            <form th:action="@{/purchase-invoices/create}" method="post">
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="supplier" class="form-label">
                                            <i class="fas fa-building me-2"></i>Supplier
                                        </label>
                                        <select id="supplier" name="supplierId" class="form-select" required>
                                            <option value="">Select a supplier</option>
                                            <option th:each="supplier : ${suppliers}"
                                                    th:value="${supplier.id}"
                                                    th:text="${supplier.name}">
                                            </option>
                                        </select>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="purchaseOrder" class="form-label">
                                            <i class="fas fa-shopping-cart me-2"></i>Purchase Order
                                        </label>
                                        <select id="purchaseOrder" name="purchaseOrderId" class="form-select">
                                            <option value="">Select a purchase order (optional)</option>
                                            <option th:each="order : ${orders}"
                                                    th:value="${order.id}"
                                                    th:text="${order.orderNumber + ' - ' + order.supplier.name}">
                                            </option>
                                        </select>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="invoiceDate" class="form-label">
                                            <i class="fas fa-calendar me-2"></i>Invoice Date
                                        </label>
                                        <input type="date" id="invoiceDate" name="invoiceDate" class="form-control" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="dueDate" class="form-label">
                                            <i class="fas fa-clock me-2"></i>Due Date
                                        </label>
                                        <input type="date" id="dueDate" name="dueDate" class="form-control" required>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="invoiceNumber" class="form-label">
                                            <i class="fas fa-hashtag me-2"></i>Invoice Number
                                        </label>
                                        <input type="text" id="invoiceNumber" name="invoiceNumber" class="form-control" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="currency" class="form-label">
                                            <i class="fas fa-money-bill me-2"></i>Currency
                                        </label>
                                        <select id="currency" name="currency" class="form-select" required>
                                            <option value="EUR">EUR</option>
                                            <option value="USD">USD</option>
                                            <option value="GBP">GBP</option>
                                        </select>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save me-2"></i>Create Invoice
                                </button>
                            </form>
                        </div>
                    </div>

                    <!-- List of invoices -->
                    <div class="card">
                        <div class="card-header">
                            <h5 class="card-title mb-0">
                                <i class="fas fa-list me-2"></i>Invoice List
                            </h5>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-hover">
                                    <thead>
                                        <tr>
                                            <th><i class="fas fa-hashtag me-2"></i>Invoice Number</th>
                                            <th><i class="fas fa-building me-2"></i>Supplier</th>
                                            <th><i class="fas fa-calendar me-2"></i>Posting Date</th>
                                            <th><i class="fas fa-clock me-2"></i>Due Date</th>
                                            <th><i class="fas fa-money-bill me-2"></i>Total</th>
                                            <th><i class="fas fa-money-bill me-2"></i>Grand Total</th>
                                            <th><i class="fas fa-money-bill me-2"></i>Currency</th>
                                            <th><i class="fas fa-tasks me-2"></i>Status</th>
                                            <th><i class="fas fa-cogs me-2"></i>Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="invoice : ${invoices}">
                                            <td th:text="${invoice.name}"></td>
                                            <td th:text="${invoice.supplier_name}"></td>
                                            <td th:text="${#strings.replace(invoice.posting_date, 'T', ' ')}"></td>
                                            <td th:text="${#strings.replace(invoice.due_date, 'T', ' ')}"></td>
                                            <td th:text="${invoice.total}"></td>
                                            <td th:text="${invoice.grand_total}"></td>
                                            <td th:text="${invoice.currency}"></td>
                                            <td>
                                                <span class="badge" th:classappend="${invoice.status == 'Draft' ? 'bg-warning' : 
                                                                                    (invoice.status == 'Submitted' ? 'bg-info' : 
                                                                                    (invoice.status == 'Paid' ? 'bg-success' : 
                                                                                    (invoice.status == 'Cancelled' ? 'bg-danger' : 'bg-secondary')))}"
                                                      th:text="${invoice.status}">
                                                </span>
                                            </td>
                                            <td>
                                                <div class="btn-group">
                                                    <a th:href="@{/purchase-invoices/{id}(id=${invoice.name})}" 
                                                       class="btn btn-sm btn-info">
                                                        <i class="fas fa-eye"></i>
                                                    </a>
                                                    <a th:href="@{/purchase-invoices/{id}/edit(id=${invoice.name})}" 
                                                       class="btn btn-sm btn-warning">
                                                        <i class="fas fa-edit"></i>
                                                    </a>
                                                    <button type="button" 
                                                            class="btn btn-sm btn-danger delete-invoice"
                                                            th:data-invoice-id="${invoice.name}">
                                                        <i class="fas fa-trash"></i>
                                                    </button>
                                                </div>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div th:insert="fragments/footer :: footer"></div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('.delete-invoice').forEach(function(button) {
                button.addEventListener('click', function() {
                    const invoiceId = this.getAttribute('data-invoice-id');
                    if (confirm('Are you sure you want to delete this invoice?')) {
                        window.location.href = '/purchase-invoices/' + invoiceId + '/delete';
                    }
                });
            });
        });
    </script>
</body>
</html>
