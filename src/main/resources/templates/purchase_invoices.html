<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purchase Invoices</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 bg-light">
                <div th:insert="fragments/sidebar :: sidebar"></div> <!-- Include the sidebar -->
            </div>
            <div class="col-md-9">
                <h1 class="mt-3">Purchase Invoices</h1>

                <!-- Display error message if present -->
                <div th:if="${error}" class="text-danger">
                    <p th:text="${error}"></p>
                </div>

                <div class="table-responsive mt-3">
                    <table class="table table-bordered table-striped">
                        <thead class="table-dark">
                            <tr>
                                <th>Invoice Name</th>
                                <th>Owner</th>
                                <th>Posting Date</th>
                                <th>Total</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="invoice : ${invoices}">
                                <td th:text="${invoice.name}"></td>
                                <td th:text="${invoice.owner}"></td>
                                <td th:text="${invoice.posting_date}"></td>
                                <td th:text="${invoice.total}"></td>
                                <td th:text="${invoice.status}"></td>
                                
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <footer class="mt-auto bg-dark text-white text-center py-3">
        <div th:insert="fragments/footer :: footer"></div>
    </footer>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
