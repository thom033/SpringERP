<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .sidebar-brand {
            font-size: 1.5rem;
            color: white;
            text-decoration: none;
            padding: 1rem;
            margin-bottom: 2rem;
            display: block;
            text-align: center;
            font-weight: bold;
        }
        .nav-link {
            color: rgba(255, 255, 255, 0.8) !important;
            padding: 0.8rem 1rem !important;
            margin: 0.2rem 0;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .nav-link:hover {
            background-color: rgba(255, 255, 255, 0.1);
            color: white !important;
            transform: translateX(5px);
        }
        .nav-link.active {
            background-color: var(--secondary-color);
            color: white !important;
        }
        .nav-link i {
            width: 24px;
            text-align: center;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div th:fragment="sidebar">
        <div class="sidebar">
            <a href="/supplier" class="sidebar-brand">
                <i class="fas fa-chart-line"></i>
                SpringERP
            </a>
            <nav>
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activePage == 'supplier'} ? 'active'" th:href="@{/supplier}">
                            <i class="fas fa-building"></i>
                            <span>Supplier</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activePage == 'supplier-quotation'} ? 'active'" th:href="@{/supplier-quotation}">
                            <i class="fas fa-file-invoice-dollar"></i>
                            <span>Supplier Quotation</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activePage == 'purchase-orders'} ? 'active'" th:href="@{/purchase-orders}">
                            <i class="fas fa-shopping-cart"></i>
                            <span>Purchase Order</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activePage == 'purchase-invoices'} ? 'active'" th:href="@{/purchase-invoices}">
                            <i class="fas fa-file-invoice"></i>
                            <span>Purchase Invoices</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</body>
</html>
