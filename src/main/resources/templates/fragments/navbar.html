<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <style>
        .navbar {
            box-shadow: 0 2px 8px rgba(0,0,0,0.07);
            position: sticky;
            top: 0;
            z-index: 1000;
            background: #fff;
        }
        .navbar .dropdown-menu {
            border-radius: 0.5rem;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }
        .navbar-nav .nav-link {
            transition: background 0.2s, color 0.2s;
            border-radius: 0.4rem;
            margin-right: 0.25rem;
            padding-left: 1rem;
            padding-right: 1rem;
        }
        .navbar-nav .nav-link:hover, .navbar-nav .nav-link.active {
            background: #f0f4f8;
            color: #198754 !important;
        }
        .navbar-brand {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .navbar-divider {
            border-left: 1px solid #e0e0e0;
            height: 32px;
            margin: 0 1rem;
        }
        @media (max-width: 991px) {
            .navbar-divider {
                display: none;
            }
        }
    </style>
</head>
<body>
    <nav th:fragment="navbar(activeApp)" class="navbar navbar-expand-lg navbar-light bg-white">
        <div class="container">
            <!-- Dropdown pour basculer entre ERP et RH -->
            <div class="dropdown">
                <a class="navbar-brand dropdown-toggle d-flex align-items-center" href="#" id="appDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="bi" th:classappend="${activeApp == 'rh'} ? 'bi-people-fill text-success' : 'bi-building text-primary'"></i>
                    <span class="fw-bold ms-2" th:text="${activeApp == 'rh'} ? 'RH Spring' : 'ERP Spring'">ERP Spring</span>
                </a>
                <ul class="dropdown-menu" aria-labelledby="appDropdown">
                    <li>
                        <a class="dropdown-item d-flex align-items-center" th:href="@{/suppliers}" th:if="${activeApp != 'erp'}">
                            <i class="bi bi-building me-2 text-primary"></i> ERP Spring
                        </a>
                    </li>
                    <li>
                        <a class="dropdown-item d-flex align-items-center" th:href="@{/employee}" th:if="${activeApp != 'rh'}">
                            <i class="bi bi-people-fill me-2 text-success"></i> RH Spring
                        </a>
                    </li>
                </ul>
            </div>
            <span class="navbar-divider d-none d-lg-block"></span>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <!-- Menu ERP -->
                <ul class="navbar-nav me-auto" th:if="${activeApp == null or activeApp == 'erp'}">
                    <li class="nav-item">
                        <a class="nav-link d-flex align-items-center" th:href="@{/warehouse}">
                            <i class="bi bi-speedometer2 me-2"></i>
                            <span>Warehouse</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link d-flex align-items-center" th:href="@{/stock}">
                            <i class="bi bi-speedometer2 me-2"></i>
                            <span>Stock</span>
                        </a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" role="button" data-bs-toggle="dropdown">
                            <i class="bi bi-people me-2"></i>
                            <span>Fournisseurs</span>
                        </a>
                        <ul class="dropdown-menu shadow-sm">
                            <li>
                                <a class="dropdown-item d-flex align-items-center" th:href="@{/suppliers}">
                                    <i class="bi bi-list-ul me-2 text-primary"></i>
                                    Liste des fournisseurs
                                </a>
                            </li>
                        </ul>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" role="button" data-bs-toggle="dropdown">
                            <i class="bi bi-cash-coin me-2"></i>
                            <span>Comptabilité</span>
                        </a>
                        <ul class="dropdown-menu shadow-sm">
                            <li>
                                <a class="dropdown-item d-flex align-items-center" th:href="@{/accounting/invoices}">
                                    <i class="bi bi-receipt me-2 text-primary"></i>
                                    Factures
                                </a>
                            </li>
                        </ul>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" role="button" data-bs-toggle="dropdown">
                            <i class="bi bi-cash-coin me-2"></i>
                            <span>CSV</span>
                        </a>
                        <ul class="dropdown-menu shadow-sm">
                            <li>
                                <a class="dropdown-item d-flex align-items-center" th:href="@{/accounting/invoices}">
                                    <i class="bi bi-receipt me-2 text-primary"></i>
                                    Eval 2
                                </a>
                            </li>
                        </ul>
                    </li>
                </ul>
                <!-- Menu RH -->
                <ul class="navbar-nav me-auto" th:if="${activeApp == 'rh'}">
                    <li class="nav-item">
                        <a class="nav-link d-flex align-items-center" th:href="@{/employee}">
                            <i class="bi bi-people-fill me-2"></i>
                            <span>Employés</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link d-flex align-items-center" th:href="@{/salary/all}">
                            <i class="bi bi-cash-stack me-2"></i>
                            <span>Paie</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link d-flex align-items-center" th:href="@{/salary/statistic}">
                            <i class="bi bi-bar-chart-line me-2"></i>
                            <span>Statistique</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link d-flex align-items-center" th:href="@{/csv}">
                            <i class="bi bi-file-earmark-spreadsheet me-2"></i>
                            <span>CSV</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link d-flex align-items-center" th:href="@{/salary/graph}">
                            <i class="bi bi-graph-up-arrow me-2"></i>
                            <span>Graph</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link d-flex align-items-center" th:href="@{/salary/generate}">
                            <i class="bi bi-gear me-2"></i>
                            <span>Generate</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link d-flex align-items-center" th:href="@{/salary/update-base}">
                            <i class="bi bi-pencil-square me-2"></i>
                            <span>Update</span>
                        </a>
                    </li>
                    <!-- Ajoute d'autres liens RH ici -->
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link d-flex align-items-center" href="/logout">
                            <i class="bi bi-box-arrow-right me-2"></i>
                            <span>Déconnexion</span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</body>
</html>
