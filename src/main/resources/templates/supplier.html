<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Suppliers</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 px-0">
                <div th:insert="fragments/sidebar :: sidebar"></div>
            </div>

            <!-- Main Content -->
            <div class="col-md-9 col-lg-10 ms-auto">
                <div class="main-content">
                    <h1 class="page-title">
                        <i class="fas fa-users me-2"></i>Supplier Management
                    </h1>

                    <!-- Display error message if present -->
                    <div th:if="${error}" class="alert alert-danger">
                        <i class="fas fa-exclamation-circle me-2"></i>
                        <span th:text="${error}"></span>
                    </div>

                    <!-- Display selected supplier if present -->
                    <div class="alert alert-success" th:if="${session.selectedSupplier}">
                        <i class="fas fa-check-circle me-2"></i>
                        Selected Supplier: <strong th:text="${session.selectedSupplier}"></strong>
                    </div>

                    <!-- Form to select a supplier -->
                    <div class="card">
                        <div class="card-header">
                            <h5 class="card-title mb-0">
                                <i class="fas fa-hand-pointer me-2"></i>Select Supplier
                            </h5>
                        </div>
                        <div class="card-body">
                            <form th:action="@{/select-supplier}" method="post">
                                <div class="mb-3">
                                    <label for="supplier" class="form-label">
                                        <i class="fas fa-building me-2"></i>Choose a Supplier:
                                    </label>
                                    <select id="supplier" name="supplierName" class="form-select">
                                        <option th:each="supplier : ${suppliers}" 
                                                th:value="${supplier.supplier_name}" 
                                                th:text="${supplier.supplier_name}">
                                        </option>
                                    </select>
                                </div>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-check me-2"></i>Select Supplier
                                </button>
                            </form>
                        </div>
                    </div>

                    <!-- Display the list of suppliers -->
                    <div class="card">
                        <div class="card-header">
                            <h5 class="card-title mb-0">
                                <i class="fas fa-list me-2"></i>Supplier List
                            </h5>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-hover">
                                    <thead>
                                        <tr>
                                            <th><i class="fas fa-building me-2"></i>Supplier Name</th>
                                            <th><i class="fas fa-user me-2"></i>Name</th>
                                            <th><i class="fas fa-globe me-2"></i>Country</th>
                                            <th><i class="fas fa-tag me-2"></i>Supplier Type</th>
                                            <th><i class="fas fa-language me-2"></i>Language</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="supplier : ${suppliers}">
                                            <td th:text="${supplier.supplier_name}"></td>
                                            <td th:text="${supplier.name}"></td>
                                            <td th:text="${supplier.country}"></td>
                                            <td th:text="${supplier.supplier_type}"></td>
                                            <td th:text="${supplier.language}"></td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div th:insert="fragments/footer :: footer"></div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
