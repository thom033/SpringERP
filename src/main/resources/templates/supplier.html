<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Suppliers</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 bg-light">
                <div th:insert="fragments/sidebar :: sidebar"></div>
            </div>
            <div class="col-md-9">
                <h1 class="mt-3">Supplier List</h1>

                <!-- Display error message if present -->
                <div th:if="${error}" class="text-danger">
                    <p th:text="${error}"></p>
                </div>

                <!-- Display selected supplier if present -->
                <div class="alert alert-success" th:if="${session.selectedSupplier}">
                    Selected Supplier: <span th:text="${session.selectedSupplier}"></span>
                </div>

                <!-- Form to select a supplier -->
                <form th:action="@{/select-supplier}" method="post" class="mb-3">
                    <div class="mb-3">
                        <label for="supplier" class="form-label">Choose a Supplier:</label>
                        <select id="supplier" name="supplierName" class="form-select">
                            <option th:each="supplier : ${suppliers}" 
                                    th:value="${supplier.supplier_name}" 
                                    th:text="${supplier.supplier_name}">
                            </option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Select</button>
                </form>

                <!-- Display the list of suppliers -->
                <table class="table table-bordered mt-3">
                    <thead class="table-dark">
                        <tr>
                            <th>Supplier Name</th>
                            <th>Name</th>
                            <th>Country</th>
                            <th>Supplier Type</th>
                            <th>Language</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="supplier : ${suppliers}">
                            <td th:text="${supplier.supplier_name}"></td>
                            <td th:text="${supplier.name}"></td>
                            <td th:text="${supplier.country}"></td>
                            <td th:text="${supplier.supplier_type}"></td>
                            <td th:text="${supplier.language}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <footer class="mt-auto bg-dark text-white text-center py-3">
        <div th:insert="fragments/footer :: footer"></div>
    </footer>
</body>
</html>
