<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supplier Quotations</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 bg-light">
                <div th:insert="fragments/sidebar :: sidebar"></div> <!-- Include the sidebar -->
            </div>
            <div class="col-md-9">
                <h1 class="mt-3">Supplier Quotations</h1>

                <!-- Display error message if present -->
                <div th:if="${error}" class="text-danger">
                    <p th:text="${error}"></p>
                </div>

                <div class="table-responsive mt-3">
                    <div th:if="${message}" class="alert alert-info">
                        <p th:text="${message}"></p>
                    </div>
                    <table class="table table-bordered table-striped" th:if="${supplierQuotations}">
                        <thead class="table-dark">
                            <tr>
                                <th>Name</th>
                                <th>Owner</th>
                                <th>Creation</th>
                                <th>Status</th>
                                <th>Transaction Date</th>
                                <th>Valid Till</th>
                                <th>Total</th>
                                <th>Supplier</th>
                                <th>Company</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="quotation : ${supplierQuotations}">
                                <td th:text="${quotation.name}"></td>
                                <td th:text="${quotation.owner}"></td>
                                <td th:text="${quotation.creation}"></td>
                                <td th:text="${quotation.status}"></td>
                                <td th:text="${quotation.transaction_date}"></td>
                                <td th:text="${quotation.valid_till}"></td>
                                <td th:text="${quotation.total}"></td>
                                <td th:text="${quotation.supplier}"></td>
                                <td th:text="${quotation.company}"></td>
                                <td>
                                    <a th:href="@{/supplier-quotation-edit(id=${quotation.name})}" class="btn btn-warning">Edit Price</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <footer class="mt-auto bg-dark text-white text-center py-3">
        <div th:insert="fragments/footer :: footer"></div>
    </footer>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
