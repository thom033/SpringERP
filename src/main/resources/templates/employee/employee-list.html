<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Liste des Fournisseurs</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
    <!-- Inclure la navbar -->
    <div th:replace="~{fragments/navbar :: navbar('rh')}"></div>

<div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="mb-1">Liste des Employee</h2>
                <p class="text-muted mb-0">Gérez vos Employee et leurs documents</p>
            </div>
        </div>

        <div>
            <form th:action="@{/employee}" class="row g-2 align-items-end mb-3" method="POST">
                <div class="col-auto">
                    <label for="nom" class="form-label mb-0">Nom</label>
                    <input type="text" id="nom" name="nom" class="form-control" min="1900" max="2100" placeholder="Nom">
                </div>
                <div class="col-auto">
                    <label for="gender" class="form-label mb-0">Gender</label>
                    <select id="gender" name="gender" class="form-select" min="1900" max="2100">
                        <option value="">Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>        
                <div class="col-auto">
                    <button type="submit" class="btn btn-primary">Filtrer</button>
                </div>
            </form>
        </div>
        
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Ref</th>
                                <th>Name</th>
                                <th>Gender</th>
                                <th>Date of birth</th>
                                <th>Date of joining</th>
                                <th>Status</th>
                                <th>Company</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="employee : ${employees}">
                                <td th:text="${employee.ref}"></td>
                                <td th:text="${employee.first_name + ' ' + employee.last_name}"></td>
                                <td th:text="${employee.gender}"></td>
                                <td th:text="${employee.date_of_birth}"></td>
                                <td th:text="${employee.date_of_joining}"></td>
                                <td th:text="${employee.status}"></td> 
                                <td th:text="${employee.company}"></td> 
                                <td>
                                    <a th:href="@{/salary/{id}(id=${employee.name})}" class="btn btn-outline-primary btn-sm">
                                        <i class="bi bi-eye"></i> Voir détail
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
